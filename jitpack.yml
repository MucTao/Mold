jdk:
  - openjdk17

before_install:
  - echo "Setting up build environment"
  - wget https://services.gradle.org/distributions/gradle-9.6.1-bin.zip
  - unzip gradle-9.6.1-bin.zip
  - export GRADLE_HOME=$PWD/gradle-9.6.1
  - export PATH=$GRADLE_HOME/bin:$PATH
  - echo "Cleaning Gradle cache and build artifacts"
  - rm -rf ~/.gradle/caches/modules-2/files-2.1/
  - mkdir -p ~/.gradle/caches/modules-2/files-2.1/
  - rm -rf /home/jitpack/build/core/*/build/
  - rm -rf /home/jitpack/build/build/

android:
  components:
    - build-tools;36.0.0
    - platforms;android-37.0

install:
  - ./gradlew clean publishToMavenLocal -no-daemon -no-build-cache --no-configuration-cache --refresh-dependencies -x test -x lint -x :desktopApp:build -x :desktopApp:jar