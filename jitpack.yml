before_install:
  - sdk install java 8
  - wget https://services.gradle.org/distributions/gradle-9.6.1-bin.zip
  - unzip gradle-9.6.1-bin.zip
  - export GRADLE_HOME=$PWD/gradle-9.6.1
  - export PATH=$GRADLE_HOME/bin:$PATH
install:
  - ./gradlew clean publishToMavenLocal -x :core:ui:compileKotlinJvm -x :core:ui:compileAndroidMain -x :core:ui:compileCommonMainKotlinMetadata -x :core:ui:compileKotlinIosArm64 -x :core:ui:compileKotlinIosSimulatorArm64 -x :core:ui:compileIosMainKotlinMetadata